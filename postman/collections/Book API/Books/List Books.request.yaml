$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/books'
order: 1000
examples: './.resources/List Books.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is acceptable", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response has books array", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("books");
          pm.expect(json.books).to.be.an("array");
      });

      pm.test("Each book has required fields", function () {
          const json = pm.response.json();
          json.books.forEach(function (book) {
              pm.expect(book).to.have.property("id");
              pm.expect(book).to.have.property("title");
              pm.expect(book).to.have.property("author");
              pm.expect(book.title).to.be.a("string").and.not.empty;
              pm.expect(book.author).to.be.a("string").and.not.empty;
          });
      });

      pm.test("Optional book fields have correct types when present", function () {
          const json = pm.response.json();
          json.books.forEach(function (book) {
              if (book.year !== null && book.year !== undefined) {
                  pm.expect(book.year).to.be.a("number");
              }
              if (book.publisher !== null && book.publisher !== undefined) {
                  pm.expect(book.publisher).to.be.a("string");
              }
          });
      });

      pm.execution.setNextRequest("Create Book");
