$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/books'
order: 3000
examples: './.resources/Create Book.resources/examples'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "The Hitchhiker's Guide to the Galaxy",
      "author": "Douglas Adams",
      "year": 1979,
      "publisher": "Pan Books"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response time is acceptable", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response has book object", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("book");
          pm.expect(json.book).to.be.an("object");
      });

      pm.test("Created book has an id", function () {
          const json = pm.response.json();
          pm.expect(json.book).to.have.property("id");
          pm.expect(json.book.id).to.not.be.null;
          pm.expect(json.book.id).to.not.be.undefined;
      });

      pm.test("Created book title matches request", function () {
          const json = pm.response.json();
          const requestBody = JSON.parse(pm.request.body.raw);
          pm.expect(json.book.title).to.eql(requestBody.title);
      });

      pm.test("Created book author matches request", function () {
          const json = pm.response.json();
          const requestBody = JSON.parse(pm.request.body.raw);
          pm.expect(json.book.author).to.eql(requestBody.author);
      });

      pm.test("Created book year matches request", function () {
          const json = pm.response.json();
          const requestBody = JSON.parse(pm.request.body.raw);
          pm.expect(json.book.year).to.eql(requestBody.year);
      });

      pm.test("Created book publisher matches request", function () {
          const json = pm.response.json();
          const requestBody = JSON.parse(pm.request.body.raw);
          pm.expect(json.book.publisher).to.eql(requestBody.publisher);
      });

      // Store the created book ID for use in subsequent requests
      const json = pm.response.json();
      if (json.book && json.book.id) {
          pm.collectionVariables.set("createdBookId", json.book.id);
      }

      pm.execution.setNextRequest("Get Book");
