$kind: http-example
name: 201 Created
request:
  method: POST
  url: '{{baseUrl}}/api/v1/books'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "title": "The Hitchhiker's Guide to the Galaxy",
        "author": "Douglas Adams",
        "year": 1979,
        "publisher": "Pan Books"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "book": {
          "id": "1082deb5",
          "title": "The Hitchhiker's Guide to the Galaxy",
          "author": "Douglas Adams",
          "year": 1979,
          "publisher": "Pan Books"
        }
      }
