$kind: http-example
name: 200 OK
request:
  method: GET
  url: '{{baseUrl}}/api/v1/books/1'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "book": {
          "id": "1",
          "title": "The Great Gatsby",
          "author": "F. Scott Fitzgerald",
          "year": 1925,
          "publisher": "Scribner"
        }
      }
