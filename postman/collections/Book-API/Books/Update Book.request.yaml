$kind: http-request
method: PUT
url: '{{baseUrl}}/api/v1/books/{{createdBookId}}'
order: 4000
examples: './.resources/Update Book.resources/examples'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "The Great Gatsby",
      "author": "F. Scott Fitzgerald",
      "year": 1925,
      "publisher": "Scribner"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is acceptable", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response has book object", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("book");
          pm.expect(json.book).to.be.an("object");
      });

      pm.test("Updated book has an id", function () {
          const json = pm.response.json();
          pm.expect(json.book).to.have.property("id");
          pm.expect(json.book.id).to.not.be.null;
      });

      pm.test("Updated book title matches request", function () {
          const json = pm.response.json();
          const requestBody = JSON.parse(pm.request.body.raw);
          if (requestBody.title !== undefined) {
              pm.expect(json.book.title).to.eql(requestBody.title);
          }
      });

      pm.test("Updated book author matches request", function () {
          const json = pm.response.json();
          const requestBody = JSON.parse(pm.request.body.raw);
          if (requestBody.author !== undefined) {
              pm.expect(json.book.author).to.eql(requestBody.author);
          }
      });

      pm.test("Updated book year matches request", function () {
          const json = pm.response.json();
          const requestBody = JSON.parse(pm.request.body.raw);
          if (requestBody.year !== undefined) {
              pm.expect(json.book.year).to.eql(requestBody.year);
          }
      });

      pm.test("Updated book publisher matches request", function () {
          const json = pm.response.json();
          const requestBody = JSON.parse(pm.request.body.raw);
          if (requestBody.publisher !== undefined) {
              pm.expect(json.book.publisher).to.eql(requestBody.publisher);
          }
      });

      pm.execution.setNextRequest("Delete Book");
