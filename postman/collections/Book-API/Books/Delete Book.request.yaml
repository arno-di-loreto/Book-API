$kind: http-request
method: DELETE
url: '{{baseUrl}}/api/v1/books/{{createdBookId}}'
order: 5000
examples: './.resources/Delete Book.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is acceptable", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response has message field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json.message).to.be.a("string").and.not.empty;
      });

      pm.test("Response has id field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.not.be.null;
          pm.expect(json.id).to.not.be.undefined;
      });

      pm.test("Deleted id matches requested id", function () {
          const json = pm.response.json();
          const createdId = pm.collectionVariables.get("createdBookId");
          pm.expect(String(json.id)).to.eql(String(createdId));
      });

      // Clean up the collection variable after the workflow completes
      pm.collectionVariables.unset("createdBookId");
      pm.execution.setNextRequest(null);
