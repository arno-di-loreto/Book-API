$kind: http-request
method: GET
url: '{{baseUrl}}/health'
order: 2000
examples: './.resources/Health Check.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is acceptable", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response has status field set to 'ok'", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("status");
          pm.expect(json.status).to.eql("ok");
      });

      pm.test("Response has timestamp field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("timestamp");
          pm.expect(json.timestamp).to.be.a("string").and.not.empty;
      });

      pm.test("Timestamp is a valid ISO 8601 date", function () {
          const json = pm.response.json();
          const date = new Date(json.timestamp);
          pm.expect(date.toString()).to.not.eql("Invalid Date");
      });

      pm.execution.setNextRequest("List Books");
