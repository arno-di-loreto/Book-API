$kind: http-request
method: GET
url: '{{baseUrl}}/'
order: 1000
examples: './.resources/API Root.resources/examples'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.unset("createdBookId");
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is acceptable", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response has message field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json.message).to.be.a("string").and.not.empty;
      });

      pm.test("Response has docs field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("docs");
          pm.expect(json.docs).to.be.a("string").and.not.empty;
      });

      pm.execution.setNextRequest("Health Check");
